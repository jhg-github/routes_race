<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routes Race Animator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h2>Routes Race</h2>

      <section class="panel">
        <h3>1. Map Photo</h3>
        <label class="file-input-label">
          <span>Choose Image File</span>
          <input type="file" id="mapUpload" accept="image/*">
        </label>
        <div id="mapInfo" class="info-text">No image loaded</div>
      </section>

      <section class="panel">
        <h3>2. Map Corners Calibration</h3>
        <div class="coord-group">
          <h4>Top-Right Corner</h4>
          <input type="text" id="trCoord" placeholder="lat, lon (e.g. 48.8584, 2.2945)">
        </div>
        <div class="coord-group">
          <h4>Bottom-Left Corner</h4>
          <input type="text" id="blCoord" placeholder="lat, lon (e.g. 48.8500, 2.2800)">
        </div>
      </section>

      <section class="panel">
        <h3>3. GPX Run Records</h3>
        <label class="file-input-label">
          <span>Choose GPX File(s)</span>
          <input type="file" id="gpxUpload" accept=".gpx" multiple>
        </label>
        <div id="runsList" class="runs-list"></div>
      </section>

      <section class="panel">
        <h3>4. Playback Controls</h3>
        <div class="controls-row">
          <button id="btnPlay">Play</button>
          <button id="btnReset">Reset</button>
          <select id="speedSelect">
            <option value="1">1x Speed</option>
            <option value="2">2x Speed</option>
            <option value="5" selected>5x Speed</option>
            <option value="10">10x Speed</option>
            <option value="20">20x Speed</option>
          </select>
        </div>
        <div class="timeline-row">
          <input type="range" id="timeline" min="0" max="100" value="0" step="0.1">
          <span id="timeDisplay">00:00:00</span>
        </div>
      </section>
    </aside>

    <main class="canvas-container">
      <canvas id="mapCanvas"></canvas>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
